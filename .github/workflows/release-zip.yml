name: Attach release zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à traiter (ex: v2.5.6)"
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create frisquet-connect.zip
        run: |
          cd custom_components/frisquet_connect
          zip -r ../../frisquet-connect.zip . -x "*.pyc" "__pycache__/*"
          cd ../..
          ls -l frisquet-connect.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" frisquet-connect.zip --clobber